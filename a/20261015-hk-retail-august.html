  <div class="alt-titles"><p>HK Retail Sales Rise 5.6% in August, Beating Expectations for 16th Straight Month</p><p>本港零售额连升16个月　8月增5.6%胜预期</p></div>
  <p class="lead">本港8月份零售業總銷貨價值按年上升5.6%，連續16個月錄得增長，表現遠勝市場預期。旅發局表示，8月訪港旅客人次創疫後單月新高，多項國際盛事帶動本地消費氣氛。</p>
