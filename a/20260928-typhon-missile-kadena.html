  <h1>美國「堤豐」導彈系統擬存放沖繩嘉手納基地惹抗議</h1>
  
  <p class="lead">日本沖繩縣嘉手納町町長當山宏前往防衛省沖繩防衛局，抗議美國「堤豐」中程導彈系統計劃存放於嘉手納基地，要求撤回。共同社報道，當山宏指存放期限未明確，擔心轉變為永久正式部署，批評計劃無視民眾感受、絕對無法接受。防衛省沖繩防衛局日前公布，計劃下月中旬前將現部署鹿兒島縣鹿屋航空基地的「堤豐」導彈系統移存放嘉手納基地；該系統可發射戰斧巡航導彈，早前已引起周邊國家強烈抗議。</p>
