  <h1 class="article-title">李克勤包頭演唱會遲到兩小時 草根歌手侯浪臨危救場獲讚</h1>
  <p class="lead article-summary">9月26日「紀元回聲」巡迴演唱會包頭站，李克勤因為呼和浩特落冰雹航班要備降太原、轉乘電車途中又冇電，遲到約兩個鐘，凌晨零時半先登台，連聲鞠躬道歉。助唱嘉賓侯浪喺開演前半個鐘臨危受命，喺毫無準備、冇提詞器嘅情況下連唱兩個幾鐘、十七八首歌，面對三萬觀眾，被讚「神級救場」。現場觀眾話，幾乎冇人離場，亦冇人嗌退票。</p>
  <div class="tags article-tags"><button class="tag">#李克勤</button><button class="tag">#演唱會</button><button class="tag">#包頭</button><button class="tag">#侯浪</button></div>

<script>
(function(){
  var SITE='中港新聞速報';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var LANG='zh_hant';
  try{ LANG=localStorage.getItem('hks_lang')||'zh_hant'; }catch(e){}
  var aid=location.pathname.split('/').pop().replace(/\.html$/,'');
  var d=aid.slice(0,8), durl='../data/'+d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8)+'.json';
  function pick(o){ return (o&&(o[LANG]||o.zh_hant))||''; }
  function setActive(){
    var btns=document.querySelectorAll('.lang-switch button');
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-lang')===LANG);
  }
  function setLogo(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    var bn=document.getElementById('brandName');
    if(bn&&bn.style.display==='flex')return;
    var l=document.getElementById('logoLight'),dd=document.getElementById('logoDark');
    if(l&&dd){l.style.display=dark?'none':'';dd.style.display=dark?'':'none';}
  }
  function apply(a){
    setActive();
    document.documentElement.lang = LANG==='en'?'en':(LANG==='zh_hans'?'zh-CN':'zh-Hant');
    if(!a) return;
    var h1=document.querySelector('h1.article-title');
    var lead=document.querySelector('p.article-summary');
    var tags=document.querySelector('.article-tags');
    var t=pick(a.title), s=pick(a.summary);
    if(h1&&t) h1.textContent=t;
    if(lead&&s) lead.textContent=s;
    if(tags&&a.tags){
      var arr=a.tags[LANG]||a.tags.zh_hant||[];
      if(typeof arr==='string') arr=[arr];
      var h='';
      for(var i=0;i<arr.length;i++) h+='<button class="tag">#'+esc(arr[i])+'</button>';
      tags.innerHTML=h;
    }
    if(t) document.title=t+' | '+SITE;
  }
  var btns=document.querySelectorAll('.lang-switch button');
  for(var i=0;i<btns.length;i++)(function(b){
    b.addEventListener('click',function(){
      LANG=b.getAttribute('data-lang');
      try{ localStorage.setItem('hks_lang',LANG); }catch(e){}
      apply(window.__ADATA||null);
    });
  })(btns[i]);
  var tb=document.getElementById('themeBtn');
  function setIcon(){ if(tb) tb.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'\u2600\uFE0F':'\uD83C\uDF19'; }
  if(tb) tb.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')==='dark';
    var t=cur?'light':'dark';
    document.documentElement.setAttribute('data-theme',t);
    try{ localStorage.setItem('hks_theme',t); }catch(e){}
    setIcon(); setLogo();
  });
  setIcon(); setActive(); setLogo();
  if(/^\d{8}$/.test(d)){
    fetch(durl).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(arr){
      var a=null;
      for(var i=0;i<arr.length;i++) if(arr[i].id===aid){ a=arr[i]; break; }
      window.__ADATA=a; apply(a);
    }).catch(function(){});
  }
})();
</script>
