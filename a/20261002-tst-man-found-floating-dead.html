  <h1>男子被發現於尖沙咀海面漂浮　送院後證實死亡</h1>
  <div class="alt-titles"><p>Man found floating off Tsim Sha Tsui dies in hospital</p><p>男子被发现于尖沙咀海面漂浮　送院后证实死亡</p></div>
  <p class="lead">一名年約40歲男子昨晚被發現在尖沙咀梳士巴利道對開海面漂浮。警方晚上9時許接獲途人報案，指有人在梳士巴利道30號對開約30米海面漂浮；男子被救起時昏迷，送往伊利沙伯醫院後證實死亡。警方表示現場無檢獲遺書，死因有待驗屍後確定。</p>
