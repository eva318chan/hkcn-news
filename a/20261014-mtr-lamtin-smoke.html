  <h1>港鐵藍田站月台有設備冒煙　觀塘綫列車不停藍田站</h1>
  <div class="alt-titles"><p>Equipment smokes at MTR Lam Tin station platform, Kwun Tong line trains skip the station</p><p>港铁蓝田站月台有设备冒烟　观塘线列车不停蓝田站</p></div>
  <p class="lead">早上約八時許，藍田站往黃埔方向月台有設備冒煙，觀塘綫列車不停藍田站。藍田站一度暫時關閉，港鐵及消防人員到場處理，情況處理好後列車服務陸續恢復正常。</p>
