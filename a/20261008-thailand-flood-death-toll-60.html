  <h1>泰國洪災死亡人數升至60人　多地將迎新一輪強降雨</h1>
  <div class="alt-titles"><p>Thailand flood death toll rises to 60; new round of heavy rain expected</p><p>泰国洪灾死亡人数升至60人　多地将迎新一轮强降雨</p></div>
  <p class="lead">泰國自9月16日以來的洪災已造成60人死亡，曼谷及27個府受災。泰國氣象局預警10月9日至13日多地將出現大到暴雨，政府要求加強跨府水量調度同防洪排澇。</p>
