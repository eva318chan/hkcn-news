  <h1 class="article-title">熱帶氣旋「薔琵」橫過關島 重陽節天晴炎熱最高31度</h1>
  <p class="lead article-summary">天文台表示，熱帶氣旋「薔琵」今日橫過關島一帶，本周初至中期移向呂宋以東海域，其後路徑存在變數，有機會移向中國東南沿岸，亦可能轉向偏北移向琉球群島至東海。本周後期「薔琵」外圍下沉氣流將為華南帶來大致晴朗及高溫天氣。重陽節本港市區最高氣溫約31度，新界再高一兩度，早上局部地區有一兩陣微雨，天文台已發出黃色火災危險警告。</p>
