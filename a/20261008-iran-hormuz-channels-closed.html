  <h1>伊朗革命衛隊稱將關閉霍爾木茲海峽非法航道</h1>
  <div class="alt-titles"><p>Iran&#39;s IRGC says illegal shipping lanes in Strait of Hormuz to be shut</p><p>伊朗革命卫队称将关闭霍尔木兹海峡非法航道</p></div>
  <p class="lead">伊朗革命衛隊高級顧問納格迪表示，霍爾木茲海峽內少數被利用小型船隻走私石油的「非法航道」即將被關閉。他強調海峽目前已處於伊朗武裝部隊的完全控制之下，除非伊朗的正當訴求得到滿足，局勢將持續下去。</p>
