  <h1>西灣河男途人捱撞受傷送院 七人車司機協助警方調查</h1>
  <div class="alt-titles"><p>Pedestrian injured after being hit by seven-seater in Sai Wan Ho</p><p>西湾河男途人捱撞受伤送院 七人车司机协助警方调查</p></div>
