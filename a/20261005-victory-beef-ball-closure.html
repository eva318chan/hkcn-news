  <h1 class="article-title">元朗「勝利牛丸」分店11月中結業　44年老字號僅剩一店</h1>
  <p class="lead article-summary">1982年創立、屹立元朗逾40年的老字號「勝利牛丸」，其谷亭街分店門前貼出告示，預告11月中停止營運。職員證實停業但拒絕透露原因，品牌將只剩一間分店。消息曝光後網民反應兩極，有街坊對經營困難表示惋惜。</p>

    var h1=document.querySelector('h1.article-title');
