  <div class="alt-titles"><p>Two Fed officials say one more rate hike is needed this year</p><p>两位联储局官员称今年需再加息1次</p></div>
  <p class="lead">達拉斯聯儲銀行行長洛根及聖路易斯聯儲銀行行長莫蘭表示，聯儲局今年或需再加息1次，以令通脹回落至2%目標。洛根傾向12月加息25基點，莫蘭則支持在今年最後兩次議息會議中加息。聯邦基金期貨顯示，市場預期今年加息1次的概率約六成。</p>
