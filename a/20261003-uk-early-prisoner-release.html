  <h1>英國正式實施提前釋放囚犯政策　首日約700人出獄</h1>
  <div class="alt-titles"><p>UK begins early prisoner release scheme with about 700 freed on first day</p><p>英国正式实施提前释放囚犯政策　首日约700人出狱</p></div>
  <p class="lead">英國英格蘭及威爾斯地區10月1日起正式實施提前釋放囚犯政策，首日約700名囚犯出獄。提前獲釋者須佩戴電子監控腳環；傳媒估計到明年6月，將有約4,500名囚犯因政策提前出獄。</p>
