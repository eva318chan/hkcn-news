  <h1>香港癌症死亡率30年降逾四成</h1>
  <div class="alt-titles"><p>Hong Kong&#39;s cancer death rate down more than 40% over 30 years</p></div>
  <p class="lead">衞生局局長盧寵茂在首次於香港舉行的世界癌症大會上表示，香港年齡標準化癌症死亡率30年來下降逾四成，大會吸引近二千名來自124國代表。行政長官李家超重申要將香港打造成醫療創新樞紐。</p>
