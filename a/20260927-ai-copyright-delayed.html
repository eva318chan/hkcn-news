  <h1>香港暫緩AI版權修例，先推指引</h1>
  <div class="alt-titles"><p>Hong Kong puts AI copyright law on hold, will issue guidelines first</p><p>香港暂缓AI版权修例，先推指引</p></div>
  <p class="lead">香港將暫緩修訂版權條例以規管AI模型訓練使用版權作品，改為先制訂操作指引。當局原擬引入「選擇退出」機制引起業界爭議，議員認為本地及國際對AI與版權法如何銜接仍未有共識，暫緩是審慎做法。</p>
