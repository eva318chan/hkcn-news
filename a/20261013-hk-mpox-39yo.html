  <div class="alt-titles"><p>39-year-old man confirmed with mpox, stable and in isolation</p><p>39岁男子确诊猴痘情况稳定　潜伏期内曾到访旺角「胡同」</p></div>
  <p class="lead">本港新增一宗猴痘確診個案，患者為39歲男性，情況穩定，正接受隔離治療。患者在潛伏期內曾多次到訪旺角上海街處所「胡同」，衞生防護中心建議該處所暫時關閉，並呼籲曾到訪人士留意身體狀況。</p>
