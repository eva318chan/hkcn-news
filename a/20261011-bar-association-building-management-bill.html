  <h1>大律師公會原則上支持修訂《建築物管理條例》整體方向</h1>
  <div class="alt-titles"><p>Bar Association backs overall direction of Building Management Ordinance reform</p><p>大律师公会原则上支持修订《建筑物管理条例》整体方向</p></div>
  <p class="lead">政府計劃在宏福苑火災後修訂《建築物管理條例》，減低圍標風險。大律師公會表示，原則上支持收緊維修採購及授權票規定的整體方向，但對限制可獲授權人士的建議有所保留。</p>
