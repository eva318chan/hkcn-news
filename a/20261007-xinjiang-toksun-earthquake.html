  <div class="alt-titles"><p>Magnitude 4.4 earthquake hits Toksun, Xinjiang; rescue team dispatched</p><p>新疆吐鲁番托克逊县4.4级地震　救援先遣队赶往震央</p></div>
  <p class="lead">中國地震台網測定，新疆吐魯番市托克遜縣凌晨2時15分發生4.4級地震，震源深度20公里。目前暫無人員傷亡或房屋倒塌報告。吐魯番消防救援支隊已派出地震救援先遣隊趕往震央。</p>
