  <div class="alt-titles"><p>Mid-Autumn Festival Special Transport Arrangements Announced</p><p>中秋节特别交通及运输安排公布</p></div>
  <p class="lead">運輸署公布9月24日至26日中秋節特別交通及運輸安排，大坑一帶及多區將實施封路及改道。港鐵多條路線9月25日起加強服務並延長至凌晨，輕鐵、電車、巴士及渡輪亦會加班配合，呼籲市民盡量使用公共交通工具。</p>
