  <h1>國慶黃金周｜銅鑼灣時代廣場重現人潮　有雲南旅客花萬元買化妝品</h1>
  <div class="alt-titles"><p>Golden Week crowds return to Times Square, Causeway Bay</p><p>国庆黄金周｜铜锣湾时代广场重现人潮　有云南旅客花万元买化妆品</p></div>
  <p class="lead">國慶黃金周假期，銅鑼灣時代廣場重現人潮，不少內地旅客來港購物消費。有來自雲南的旅客表示來港三日，已花費超過一萬元購買化妝品及護膚品。周邊餐飲及零售店舖生意明顯轉旺。</p>
