  <h1>李強主持國務院常務會議 研究宏觀政策發力提效</h1>
  
  <p class="lead">國務院總理李強主持召開國務院常務會議，研究宏觀政策發力提效、促進有效投資有關工作。會議指出，針對當前經濟運行中出現的問題，要加大宏觀政策逆周期調節力度，加快各類債券發行使用進度，推動「十五五」規劃明確的重大工程項目盡早開工，加力實施擴投資、促消費貼息政策；又要求研究出台穩定房地產市場、促進就業增收等政策措施，高質量做好項目準備，激發民間投資活力。</p>
