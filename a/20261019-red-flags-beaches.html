  <h1>大浪關係　赤柱正灘、石澳、大浪灣泳灘懸掛紅旗</h1>
  <div class="alt-titles"><p>Red flags hoisted at three Hong Kong Island South beaches due to big waves</p><p>大浪关系　赤柱正滩、石澳、大浪湾泳滩悬挂红旗</p></div>
  <p class="lead">康樂及文化事務署今日宣布，由於大浪關係，港島南區的赤柱正灘泳灘、石澳泳灘及大浪灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳。署方呼籲泳客注意安全，切勿冒險下水。</p>
