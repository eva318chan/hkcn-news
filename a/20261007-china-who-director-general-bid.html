  <h1>路透社：中國擬推候選人角逐世衛總幹事</h1>
  <div class="alt-titles"><p>Reuters: China to nominate Song Li for WHO director-general race</p><p>路透社：中国拟推候选人角逐世卫总干事</p></div>
