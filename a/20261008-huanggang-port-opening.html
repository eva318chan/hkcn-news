  <h1>新皇崗口岸10.12早上6時半啟用　10.11將有啟用儀式</h1>
  <div class="alt-titles"><p>New Huanggang port to open at 6:30am on October 12, launch ceremony on Oct 11</p><p>新皇岗口岸10.12早上6时半启用　10.11将有启用仪式</p></div>
  <p class="lead">消息指新皇崗口岸將於10月12日早上6時30分正式啟用，10月11日將舉行啟用儀式。皇崗口岸經歷多年重建工程後落成，以配合重建後開通的跨境出行需要。</p>
