  <h1>新皇崗口岸開通首兩小時　逾5000人次使用</h1>
  <div class="alt-titles"><p>Over 5,000 travellers use revamped Huanggang crossing in its first two hours</p><p>新皇岗口岸开通首两小时　逾5000人次使用</p></div>
  <p class="lead">重建後的新皇崗口岸今早開通，首兩小時已有逾5000人次使用，運作暢順。口岸採用「合作查驗、一次放行」新通關模式，將過關時間由原來約30分鐘大幅縮短至約5分鐘。</p>
