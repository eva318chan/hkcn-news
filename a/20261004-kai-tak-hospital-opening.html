  <h1>啟德醫院周一首階段投入服務 提供門診服務</h1>
  <div class="alt-titles"><p>Kai Tak Hospital begins first-phase service on Monday, starting with outpatient clinics</p><p>启德医院周一首阶段投入服务 提供门诊服务</p></div>
  <p class="lead">啟德醫院將於周一（10月5日）首階段投入服務，首階段主要提供門診服務，包括專科門診及日間醫療服務。醫院方面已公布服務範圍、預約方式及交通安排，方便市民求診。</p>
